name: Terraform Apply Develop
on: { workflow_dispatch: {} }
permissions: { id-token: write, contents: read }
concurrency: { group: terraform-develop, cancel-in-progress: false }
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: develop
    defaults: { run: { working-directory: infra/environments/develop } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.15.8' }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: '${{ vars.AWS_ROLE_ARN }}', aws-region: us-east-1 }
      - run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" -backend-config="key=middleware-boletos/develop/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform validate
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan -var-file=terraform.tfvars.example -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}"
      - run: terraform apply -input=false tfplan
