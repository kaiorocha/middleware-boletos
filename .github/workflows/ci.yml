name: CI

on:
  push:
    branches: [ develop, main, 'feature/*' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            # $(go env GOPATH)/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install deps
        run: go mod download
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deploy-backend-develop:
    name: Deploy backend to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [backend, frontend]
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: develop
    permissions:
      id-token: write
      contents: read

  deploy-frontend-develop:
    name: Deploy frontend to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [backend, frontend]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: develop
    permissions:
      id-token: write
      contents: read
