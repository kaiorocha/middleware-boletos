name: CI

on:
  push:
    branches: [ develop, main, 'feature/*' ]
  pull_request:
    branches: [ develop, main ]

jobs:
  detect-changes:
    name: Detect deploy changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed components
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git show --pretty=format: --name-only "$AFTER_SHA")
          else
            CHANGED_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          fi
          if grep -q '^backend/' <<< "$CHANGED_FILES"; then echo 'backend=true' >> "$GITHUB_OUTPUT"; else echo 'backend=false' >> "$GITHUB_OUTPUT"; fi
          if grep -q '^frontend/' <<< "$CHANGED_FILES"; then echo 'frontend=true' >> "$GITHUB_OUTPUT"; else echo 'frontend=false' >> "$GITHUB_OUTPUT"; fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            # $(go env GOPATH)/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      - name: Install deps
        run: go mod download
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deploy-backend-develop:
    name: Deploy backend to develop
    if: needs.detect-changes.outputs.backend == 'true'
    needs: [detect-changes, backend, frontend]
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: develop
    permissions:
      id-token: write
      contents: read

  deploy-frontend-develop:
    name: Deploy frontend to develop
    if: needs.detect-changes.outputs.frontend == 'true'
    needs: [detect-changes, backend, frontend]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: develop
    permissions:
      id-token: write
      contents: read
