name: Terraform Plan
on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform-*.yml']
permissions:
  id-token: write
  contents: read
jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        environment: [develop, production]
    runs-on: ubuntu-latest
    concurrency:
      group: terraform-plan-${{ github.event.pull_request.number }}-${{ matrix.environment }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.15.8' }
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Format
        working-directory: infra
        run: terraform fmt -recursive -check
      - name: Initialize
        run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" -backend-config="key=middleware-boletos/${{ matrix.environment }}/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - name: Validate
        run: terraform validate
      - name: Plan
        run: terraform plan -input=false -lock-timeout=5m -var-file=terraform.tfvars.example -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}"
