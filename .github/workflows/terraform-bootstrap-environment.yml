name: Terraform Bootstrap Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to provision for the first time
        required: true
        type: choice
        options: [develop, production]
      confirm:
        description: Type BOOTSTRAP to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirm == 'BOOTSTRAP'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: us-east-1
      TF_DIR: infra/environments/${{ inputs.environment }}
      ECR_REPOSITORY: middleware-boletos-backend-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Initialize environment state
        run: |
          terraform -chdir="$TF_DIR" init -input=false \
            -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=middleware-boletos/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir="$TF_DIR" validate

      - name: Create ECR first
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m \
            -target=module.ecr \
            -var-file=terraform.tfvars.example \
            -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            -out=ecr.tfplan
          terraform -chdir="$TF_DIR" apply -input=false ecr.tfplan

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Publish bootstrap image if absent
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_URL="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=bootstrap >/dev/null 2>&1; then
            echo "Bootstrap image already exists; preserving immutable tag."
          else
            docker build --platform linux/amd64 -t "$ECR_URL:bootstrap" backend
            docker push "$ECR_URL:bootstrap"
          fi

      - name: Plan full environment
        run: |
          terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m \
            -var-file=terraform.tfvars.example \
            -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}" \
            -out=environment.tfplan

      - name: Apply full environment
        run: terraform -chdir="$TF_DIR" apply -input=false environment.tfplan

      - name: Wait and smoke test
        run: |
          CLUSTER=$(terraform -chdir="$TF_DIR" output -raw ecs_cluster_name)
          SERVICE=$(terraform -chdir="$TF_DIR" output -raw ecs_service_name)
          API_URL=$(terraform -chdir="$TF_DIR" output -raw api_url)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          curl --fail --retry 12 --retry-delay 10 "$API_URL/health"
          curl --fail --retry 12 --retry-delay 10 "$API_URL/ready"
