name: Terraform Apply Production
on: { workflow_dispatch: {} }
permissions: { id-token: write, contents: read }
concurrency: { group: terraform-production, cancel-in-progress: false }
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    defaults: { run: { working-directory: infra/environments/production } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.15.8' }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: '${{ vars.AWS_ROLE_ARN }}', aws-region: us-east-1 }
      - run: terraform init -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}" -backend-config="key=middleware-boletos/production/terraform.tfstate" -backend-config="region=us-east-1" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform validate
      - name: Ensure frontend bootstrap image exists
        run: |
          terraform plan -input=false -lock-timeout=5m -target=module.web_ecr -out=web-ecr.tfplan -var-file=terraform.tfvars.example -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}"
          terraform apply -input=false web-ecr.tfplan
          WEB_ECR_URL=$(terraform output -raw web_ecr_repository_url)
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "${WEB_ECR_URL%/*}"
          if ! aws ecr describe-images --repository-name middleware-boletos-frontend-production --image-ids imageTag=bootstrap >/dev/null 2>&1; then
            docker build --platform linux/amd64 -f ../../../frontend/Dockerfile -t "$WEB_ECR_URL:bootstrap" ../../..
            docker push "$WEB_ECR_URL:bootstrap"
          fi
      - run: terraform plan -input=false -lock-timeout=5m -out=tfplan -var-file=terraform.tfvars.example -var="cors_allowed_origins=${{ vars.CORS_ALLOWED_ORIGINS }}" -var="enable_https=${{ vars.ENABLE_HTTPS || 'false' }}"
      - run: terraform apply -input=false tfplan
      - name: Show external DNS CNAME records
        run: |
          {
            echo '### External DNS records'
            echo 'Create the ACM validation CNAMEs first, then the API and app CNAMEs. After ACM reports ISSUED, set the environment variable ENABLE_HTTPS=true and run this workflow again.'
            echo '```json'
            terraform output -json acm_validation_cname_records
            terraform output -json external_domain_cname_records
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
