name: Public Docs Infrastructure

on:
  pull_request:
    paths:
      - 'infra/public-docs/**'
      - '.github/workflows/public-docs-infra.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply]

permissions:
  id-token: write
  contents: read

concurrency:
  group: public-docs-infra
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    env:
      TF_DIR: infra/public-docs
      TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_domain_name: ${{ vars.PUBLIC_DOCS_DOMAIN }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      TF_VAR_enable_custom_domain: ${{ vars.PUBLIC_DOCS_DOMAIN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.15.8', terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: '${{ vars.AWS_ROLE_ARN }}', aws-region: us-east-1 }
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "${{ vars.AWS_ACCOUNT_ID }}"
      - name: Format
        run: terraform -chdir=infra fmt -recursive -check
      - name: Initialize isolated state
        run: >-
          terraform -chdir="$TF_DIR" init -input=false -reconfigure
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"
          -backend-config="key=middleware-boletos/public-docs/terraform.tfstate"
          -backend-config="region=us-east-1" -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - run: terraform -chdir="$TF_DIR" validate
      - run: terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m

  apply:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: public-docs
    env:
      TF_DIR: infra/public-docs
      TF_VAR_github_oidc_provider_arn: ${{ vars.GITHUB_OIDC_PROVIDER_ARN }}
      TF_VAR_domain_name: ${{ vars.PUBLIC_DOCS_DOMAIN }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      TF_VAR_enable_custom_domain: ${{ vars.PUBLIC_DOCS_DOMAIN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.15.8', terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@v5
        with: { role-to-assume: '${{ vars.AWS_ROLE_ARN }}', aws-region: us-east-1 }
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "${{ vars.AWS_ACCOUNT_ID }}"
      - name: Initialize isolated state
        run: >-
          terraform -chdir="$TF_DIR" init -input=false -reconfigure
          -backend-config="bucket=${{ vars.TERRAFORM_STATE_BUCKET }}"
          -backend-config="key=middleware-boletos/public-docs/terraform.tfstate"
          -backend-config="region=us-east-1" -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - run: terraform -chdir="$TF_DIR" validate
      - run: terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=public-docs.tfplan
      - run: terraform -chdir="$TF_DIR" apply -input=false public-docs.tfplan
      - name: Publish outputs
        run: |
          {
            echo '### Public docs infrastructure'
            echo "Set PUBLIC_DOCS_BUCKET=$(terraform -chdir="$TF_DIR" output -raw docs_bucket_name)"
            echo "Set PUBLIC_DOCS_DISTRIBUTION_ID=$(terraform -chdir="$TF_DIR" output -raw cloudfront_distribution_id)"
            echo "Set PUBLIC_DOCS_URL=$(terraform -chdir="$TF_DIR" output -raw docs_url)"
            echo "Set PUBLIC_DOCS_PUBLISH_ROLE_ARN=$(terraform -chdir="$TF_DIR" output -raw publisher_role_arn)"
          } >> "$GITHUB_STEP_SUMMARY"
