name: AWS Bootstrap

on:
  workflow_dispatch:
    inputs:
      state_bucket_name:
        description: Globally unique S3 bucket name for Terraform state
        required: true
        type: string
      oidc_provider_arn:
        description: Existing GitHub OIDC provider ARN
        required: true
        type: string
      confirm:
        description: Type BOOTSTRAP to confirm
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: inputs.confirm == 'BOOTSTRAP'
    runs-on: ubuntu-latest
    environment: bootstrap
    env:
      AWS_REGION: us-east-1
      TF_DIR: infra/bootstrap/terraform-state
      TF_VAR_state_bucket_name: ${{ inputs.state_bucket_name }}
      TF_VAR_oidc_provider_arn: ${{ inputs.oidc_provider_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT_ID" = "${{ vars.AWS_ACCOUNT_ID }}"

      - name: Ensure state bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "$TF_VAR_state_bucket_name" 2>/dev/null; then
            aws s3api create-bucket --bucket "$TF_VAR_state_bucket_name" --region "$AWS_REGION"
          fi

      - name: Initialize remote bootstrap state
        run: |
          terraform -chdir="$TF_DIR" init -input=false -reconfigure \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="key=middleware-boletos/bootstrap/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Import pre-created state bucket
        run: |
          if ! terraform -chdir="$TF_DIR" state list | grep -qx 'aws_s3_bucket.state'; then
            terraform -chdir="$TF_DIR" import aws_s3_bucket.state "$TF_VAR_state_bucket_name"
          fi

      - name: Validate and plan
        run: |
          terraform -chdir="$TF_DIR" fmt -check
          terraform -chdir="$TF_DIR" validate
          terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=bootstrap.tfplan

      - name: Apply bootstrap
        run: terraform -chdir="$TF_DIR" apply -input=false bootstrap.tfplan

      - name: Publish outputs
        run: |
          {
            echo '### AWS bootstrap completed'
            echo 'Configure the following GitHub variables:'
            echo "- TERRAFORM_STATE_BUCKET=$(terraform -chdir="$TF_DIR" output -raw state_bucket)"
            echo "- AWS_ROLE_ARN=$(terraform -chdir="$TF_DIR" output -raw github_actions_role_arn)"
          } >> "$GITHUB_STEP_SUMMARY"
